name: BEAN fast teaching and reversible compact score ledger
on:
  push:
    branches: ['experiment/bean-fast-ledger-20261024']
    paths:
      - 'src/bean_compact_scores.py'
      - 'src/bean_multistep_environment.py'
      - 'src/bean_wide_multistep.py'
      - 'scripts/bean_fast_benchmark.py'
      - 'tests/test_bean_compact_scores.py'
      - '.github/workflows/bean-fast-ledger.yml'
  pull_request:
    paths:
      - 'src/bean_compact_scores.py'
      - 'scripts/bean_fast_benchmark.py'
      - 'tests/test_bean_compact_scores.py'
      - '.github/workflows/bean-fast-ledger.yml'
permissions:
  contents: write
jobs:
  verify-speed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-research.txt
      - run: python -m pip install -r requirements-research.txt
      - uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN
          ref: 887935ae816b4ce6175c6cde54d749f0e5cf3268
          path: core-bean
      - uses: actions/checkout@v4
        with:
          ref: e49bb7e1052181a80be06ed23fd26316deae3ceb
          path: frozen-reference
      - name: Exact scores, loss retention, pair decoding, no future credit and actual Core contracts
        env:
          BEAN_CORE_DIR: core-bean
        run: python -m unittest tests.test_bean_compact_scores tests.test_bean_wide_multistep -v
      - name: Compare full teaching bytes, original decision events and entire Core training states
        run: python -m scripts.bean_fast_benchmark --reference-root frozen-reference --core-dir core-bean --output /tmp/bean-fast-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: bean-fast-equivalence-${{ github.run_id }}
          path: /tmp/bean-fast-benchmark.json
      - name: Preserve the actual measured speed and equivalence receipt
        if: github.event_name == 'push'
        run: |
          mkdir -p research/bean_fast_ledger_20261024
          cp /tmp/bean-fast-benchmark.json research/bean_fast_ledger_20261024/benchmark.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/bean_fast_ledger_20261024/benchmark.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Archive exact fast-path equivalence and measured teaching throughput'
          git fetch origin experiment/bean-fast-ledger-20261024
          git rebase origin/experiment/bean-fast-ledger-20261024
          git push origin HEAD:experiment/bean-fast-ledger-20261024
