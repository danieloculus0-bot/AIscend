name: AIscend Strategy Research Evidence
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '19 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Test causal trading research and order policy
        run: |
          python -m unittest discover -s tests -p 'test_primary*.py' -v
          python -m unittest discover -s tests -p 'test_strategy_research.py' -v
      - name: Download public Coinbase candles and evaluate training vs holdout
        run: |
          python -m src.strategy_research --days 21 --fee-bps 90 --output strategy_evidence.json
      - name: Preserve report, including failures or inconclusive results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aiscend-strategy-evidence-${{ github.run_number }}
          path: strategy_evidence.json
          if-no-files-found: warn
          retention-days: 30
