name: BEAN same-forecast exit-cost reserve audit
on:
  push:
    branches: ['experiment/bean-economic-values-20261024']
    paths:
      - 'src/bean_route_values.py'
      - 'src/bean_action_aliases.py'
      - 'src/bean_frozen_action_worker.py'
      - 'scripts/bean_exit_cost_audit.py'
      - 'scripts/bean_alias_value_audit.py'
      - 'tests/test_bean_route_values.py'
      - '.github/workflows/bean-exit-cost-audit.yml'
  pull_request:
    paths:
      - 'src/bean_route_values.py'
      - 'scripts/bean_exit_cost_audit.py'
      - 'tests/test_bean_route_values.py'
      - '.github/workflows/bean-exit-cost-audit.yml'
permissions:
  contents: write
jobs:
  exit-reserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-research.txt
      - uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN
          ref: 887935ae816b4ce6175c6cde54d749f0e5cf3268
          path: core-bean
      - run: python -m unittest tests.test_bean_route_values -v
      - name: Reproduce the source policy and isolate exit reserves
        if: github.event_name == 'push'
        run: python -m scripts.bean_exit_cost_audit --source research/bean_economic_values_chunked_20261024 --candles research/bean_strategy_curriculum_20261024/source/candles.jsonl.gz --output /tmp/bean-exit-cost-audit-20261024
      - name: Recover frozen chunked Core weights and isolate equivalent-action values
        if: github.event_name == 'push'
        run: python -m scripts.bean_alias_value_audit --source research/bean_economic_values_chunked_20261024 --candles research/bean_strategy_curriculum_20261024/source/candles.jsonl.gz --core-dir core-bean --output /tmp/bean-action-alias-audit-20261024
      - name: Archive all audit cases on the research branch
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          source=Path('/tmp/bean-exit-cost-audit-20261024');target=Path('research/bean_exit_cost_audit_20261024');target.mkdir(parents=True,exist_ok=True)
          for p in source.iterdir():
              if p.name.endswith(('.sqlite3','.jsonl')):continue
              shutil.copy2(p,target/p.name)
          (target/'.gitignore').write_text('*.sqlite3\n*.sqlite3-*\n*.jsonl\n!*.sqlite3.gz\n!*.jsonl.gz\n')
          (target/'artifacts_manifest.json').write_text(json.dumps({'files':{p.name:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(target.iterdir()) if p.is_file() and p.name!='artifacts_manifest.json'}},indent=2)+'\n')
          source=Path('/tmp/bean-action-alias-audit-20261024');target=Path('research/bean_action_alias_audit_20261024');target.mkdir(parents=True,exist_ok=True)
          for p in source.iterdir():
              if p.name.endswith(('.sqlite3','.jsonl')):continue
              shutil.copy2(p,target/p.name)
          (target/'.gitignore').write_text('*.sqlite3\n*.sqlite3-*\n*.jsonl\n!*.sqlite3.gz\n!*.jsonl.gz\n')
          (target/'artifacts_manifest.json').write_text(json.dumps({'files':{p.name:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(target.iterdir()) if p.is_file() and p.name!='artifacts_manifest.json'}},indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/bean_exit_cost_audit_20261024 research/bean_action_alias_audit_20261024
          git commit -m 'Archive same-forecast exit-cost valuation audit and all outcomes'
          git push origin HEAD:experiment/bean-economic-values-20261024
