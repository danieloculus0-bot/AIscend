name: BEAN complete source-row gradient coverage
on:
  push:
    branches: ['experiment/bean-economic-values-20261024']
    paths:
      - 'src/bean_full_pass_learning.py'
      - 'tests/test_bean_full_pass_learning.py'
      - '.github/workflows/bean-full-pass-learning.yml'
  pull_request:
    paths:
      - 'src/bean_full_pass_learning.py'
      - 'tests/test_bean_full_pass_learning.py'
      - '.github/workflows/bean-full-pass-learning.yml'
permissions:
  contents: write
jobs:
  source-row-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-research.txt
      - uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN
          ref: 887935ae816b4ce6175c6cde54d749f0e5cf3268
          path: core-bean
      - name: Actual Core gradients, eviction-spanning coverage and budget checks
        env:
          BEAN_CORE_DIR: core-bean
        run: python -m unittest tests.test_bean_economic_values tests.test_bean_full_pass_learning -v
      - name: Compare guaranteed full-pass learning on both reward bases
        if: github.event_name == 'push'
        run: python -m src.bean_full_pass_learning --source research/bean_economic_values_chunked_20261024 --alias-control research/bean_action_alias_audit_20261024 --liquidation-control research/bean_net_liquidation_learning_20261024 --candles research/bean_strategy_curriculum_20261024/source/candles.jsonl.gz --core-dir core-bean --output /tmp/bean-full-pass-learning-20261024
      - name: Preserve all source-row coverage receipts, states and outcomes
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          source=Path('/tmp/bean-full-pass-learning-20261024');target=Path('research/bean_full_pass_learning_20261024');target.mkdir(parents=True,exist_ok=True)
          for p in source.iterdir():
              if p.name.endswith(('.sqlite3','.jsonl')):continue
              shutil.copy2(p,target/p.name)
          (target/'.gitignore').write_text('*.sqlite3\n*.sqlite3-*\n*.jsonl\n!*.sqlite3.gz\n!*.jsonl.gz\n')
          (target/'artifacts_manifest.json').write_text(json.dumps({'files':{p.name:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(target.iterdir()) if p.is_file() and p.name!='artifacts_manifest.json'}},indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/bean_full_pass_learning_20261024
          git commit -m 'Archive complete source-row training and every matched outcome'
          git push origin HEAD:experiment/bean-economic-values-20261024
