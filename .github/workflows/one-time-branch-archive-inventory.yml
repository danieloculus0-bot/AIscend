name: One-time archive branch-tip inventory
on:
  push:
    branches: [main]
    paths: [.github/workflows/one-time-branch-archive-inventory.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check all public branch tips for contained archived data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error,urllib.parse
          repo=os.environ['GITHUB_REPOSITORY']
          path='research/bean_curriculum_aborted_numeric_20261024.zip'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'confidentiality-inventory'}
          def fetch(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:return json.load(r)
          branches=[]
          for page in range(1,10):
              batch=fetch('https://api.github.com/repos/'+repo+'/branches?per_page=100&page='+str(page))
              branches.extend(batch)
              if len(batch)<100:break
          matches=[]; errors=[]
          for item in branches:
              name=item['name']
              url='https://api.github.com/repos/'+repo+'/contents/'+path+'?ref='+urllib.parse.quote(name,safe='')
              try:
                  row=fetch(url)
                  matches.append({'branch':name,'sha':row.get('sha'),'size':row.get('size')})
              except urllib.error.HTTPError as e:
                  if e.code!=404:errors.append({'branch':name,'status':e.code})
              except Exception as e:errors.append({'branch':name,'error':type(e).__name__})
          print('ARCHIVE_BRANCH_TIP_INVENTORY '+json.dumps({'branches_checked':len(branches),'matches':matches,'errors':errors},separators=(',',':')),flush=True)
          PY
