name: BEAN matched lessons, retention and cross-asset recall
on:
  push:
    branches: ['experiment/bean-retained-teaching-20261024']
    paths:
      - 'src/bean_retained_lessons.py'
      - 'src/bean_teaching_study.py'
      - 'tests/test_bean_retained_teaching.py'
      - '.github/workflows/bean-retained-teaching.yml'
  pull_request:
    paths:
      - 'src/bean_retained_lessons.py'
      - 'src/bean_teaching_study.py'
      - 'tests/test_bean_retained_teaching.py'
      - '.github/workflows/bean-retained-teaching.yml'
permissions:
  contents: write
jobs:
  teach:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-research.txt
      - run: python -m pip install -r requirements-research.txt
      - uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN
          ref: 887935ae816b4ce6175c6cde54d749f0e5cf3268
          path: core-bean
      - name: Actual retained teaching, matched effects, future rejection and recall evidence
        env:
          BEAN_CORE_DIR: core-bean
        run: python -m unittest tests.test_bean_retained_teaching tests.test_bean_cached_search tests.test_bean_strategy_curriculum tests.test_bean_wide_multistep -v
      - name: Train and compare equal-budget teaching and mature cross-asset recall
        if: github.event_name == 'push'
        run: python -m src.bean_teaching_study --history research/bean_wide_history_20261024 --corpus research/bean_wide_multistep_capital_20261024 --core-dir core-bean --output /tmp/bean-retained-teaching
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && always()
        with:
          name: bean-retained-teaching-${{ github.run_id }}
          path: /tmp/bean-retained-teaching/
          retention-days: 90
      - name: Archive every model, lesson, memory dictionary, decision and failed outcome
        if: github.event_name == 'push'
        run: |
          bean_archive_path="research/bean_retained_teaching/run-${{ github.run_id }}"
          mkdir -p research/bean_retained_teaching
          cp -r /tmp/bean-retained-teaching "$bean_archive_path"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$bean_archive_path"
          git commit -m 'Retain matched BEAN teaching, active lessons, all neural states and outcomes'
          git fetch origin experiment/bean-retained-teaching-20261024
          git rebase origin/experiment/bean-retained-teaching-20261024
          git push origin HEAD:experiment/bean-retained-teaching-20261024
