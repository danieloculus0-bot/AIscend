name: One-time compressed artifact confidentiality scan
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-archive-scan.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan archived text without printing content
        env:
          TERMS_B64: RVogRmFicmljYXRpbmd8RVogRmFifEVaLUZhYnxFWi1XTUZ8V2FzaGluZ3RvbiBNZXRhbCBGYWJyaWNhdG9yc3xXTUZ8V2lzY29uc2luIE1ldGFsIEZhYnJpY2F0b3JzfENoYXRmaWVsZHxFWkZBQnxFWkZhYnJpY2F0aW5n
        run: |
          python - <<'PY'
          import base64, os, io, zipfile, re, json
          terms=[re.sub('[^a-z0-9]','',s.lower()) for s in base64.b64decode(os.environ['TERMS_B64']).decode().split('|')]
          paths=[
           'research/bean-five-year/run-40112062839.zip',
           'research/bean-five-year/run-40114799875.zip',
           'research/bean_causal_aborted_runs_20261024.zip',
           'research/bean_curriculum_aborted_numeric_20261024.zip',
           'research/bean_strategy_curriculum_20261024/source/source_archives.zip'
          ]
          def inspect(raw,label,depth=0):
           hits=[]; errors=0; files=0
           if depth<5 and zipfile.is_zipfile(io.BytesIO(raw)):
            with zipfile.ZipFile(io.BytesIO(raw)) as z:
             for f in z.infolist():
              if f.is_dir():continue
              files+=1
              try:
               if f.file_size>50000000: errors+=1;continue
               sub,er,n=inspect(z.read(f),label+'/'+f.filename,depth+1)
               hits+=sub; errors+=er; files+=n
              except Exception: errors+=1
           else:
            if b'\x00' not in raw[:8192]:
             s=re.sub('[^a-z0-9]','',(label+' '+raw.decode('utf-8','replace')).lower())
             if any(t in s for t in terms):hits.append(label)
           return hits,errors,files
          for p in paths:
           try:
            with open(p,'rb') as f: raw=f.read()
            hits,err,files=inspect(raw,p)
            print('ARCHIVE_SWEEP '+json.dumps({'archive':p,'nested_files':files,'matches':hits[:50],'count':len(hits),'unreadable':err},separators=(',',':')),flush=True)
           except Exception as e:
            print('ARCHIVE_SWEEP_ERROR '+json.dumps({'archive':p,'error':type(e).__name__}),flush=True)
          PY
