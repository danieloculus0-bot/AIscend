name: BEAN Coinbase historical strategy challenge
on:
  workflow_dispatch:
  schedule:
    - cron: '41 9 * * *'
  pull_request:
    paths:
      - 'scripts/bean_historical_replay.py'
      - 'tests/test_bean_historical_replay.py'
      - 'scripts/bean_strategy_gate.py'
      - 'scripts/bean_strategy_school.py'
      - 'tests/test_bean_strategy_school.py'
      - 'tests/test_bean_strategy_gate.py'
      - '.github/workflows/bean-coinbase-historical.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN
          ref: main
          path: _bean_core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact BEAN Core revision for this challenge
        run: python -c "from src.bean_core_bridge import core_identity; import json; print(json.dumps(core_identity('_bean_core'), sort_keys=True))"
      - name: Verify historical replay tests
        run: python -m unittest discover -s tests -p test_bean_historical_replay.py -v
      - name: Verify multi-window acceptance gate
        run: python -m unittest discover -s tests -p test_bean_strategy_gate.py -v
      - name: Verify BEAN Strategy School curriculum
        run: python -m unittest discover -s tests -p test_bean_strategy_school.py -v
      - name: Evaluate two Coinbase windows with untouched chronological holdouts
        run: |
          python -m scripts.bean_historical_replay --days 30 --out artifacts/bean-historical-30d.json
          python -m scripts.bean_historical_replay --days 60 --out artifacts/bean-historical-60d.json
          python -m scripts.bean_strategy_gate artifacts/bean-historical-30d.json artifacts/bean-historical-60d.json --out artifacts/bean-promotion-gate.json
      - name: BEAN Strategy School learning passes on historical evidence
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          from scripts.bean_historical_replay import collect
          end = int(time.time() // 3600 * 3600)
          data = collect(end - 30 * 86400, end)
          Path('artifacts/bean-school-dataset.json').write_text(json.dumps(data))
          PY
          python -m scripts.bean_strategy_school --dataset artifacts/bean-school-dataset.json --out artifacts/bean-school-report.json
      - name: Preserve scored results and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bean-coinbase-history-${{ github.run_id }}
          path: artifacts/bean-*.json
          retention-days: 60
          if-no-files-found: warn
