name: Adaptive Growth Mock Integration
on:
  push:
    branches:
      - 'feature/bean-adaptive-growth-live-gate-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock-adaptation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries for headless GUI integration
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install Python runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run causal reward-learning integration tests
        run: python -m unittest discover -s tests -p test_bean_growth_adaptive.py -v
      - name: Verify mock wallet BUY and SELL adoption
        run: python -m unittest discover -s tests -p test_bean_growth_live_adoption.py -v
      - name: Confirm cross-market rotation reaches exchange execution adapters
        run: python -m unittest discover -s tests -p test_bean_growth_rotation.py -v
      - name: Run complete Python regression suite in isolated test modules
        # Match Python Desktop RC: every test module runs, but native Qt teardown
        # cannot crash unrelated later tests in a shared interpreter.
        # Any failing or crashing module still fails the workflow.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m scripts.python_desktop_suite
      - name: Exercise isolated Qt desktop integration
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m scripts.desktop_integration_check

      - name: Verify syntax of live adapters
        run: python -m compileall -q src/bean_growth_adaptive.py src/live.py src/advanced_live.py web_app.py
