name: BEAN cached multi-candidate search with compact scoring
on:
  push:
    branches: ['experiment/bean-fast-ledger-20261024']
    paths: ['src/bean_cached_search.py', 'tests/test_bean_cached_search.py', '.github/workflows/bean-cached-search.yml']
  pull_request:
    paths: ['src/bean_cached_search.py', 'tests/test_bean_cached_search.py', '.github/workflows/bean-cached-search.yml']
permissions:
  contents: write
jobs:
  cached-search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-research.txt
      - uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN
          ref: 887935ae816b4ce6175c6cde54d749f0e5cf3268
          path: core-bean
      - name: Exact cached gradients, recovery, source tampering and future-label purge
        env:
          BEAN_CORE_DIR: core-bean
        run: python -m unittest tests.test_bean_compact_scores tests.test_bean_cached_search -v
      - name: Train four candidates from one decoded cache and score internal selection
        if: github.event_name == 'push'
        run: python -m src.bean_cached_search --history research/bean_wide_history_20261024 --corpus research/bean_wide_multistep_capital_20261024 --core-dir core-bean --output /tmp/bean-cached-search --seeds 7 41
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && always()
        with:
          name: bean-cached-search-${{ github.run_id }}
          path: /tmp/bean-cached-search/
          retention-days: 90
      - name: Retain every candidate, score, losing outcome and complete model
        if: github.event_name == 'push'
        run: |
          cp -r /tmp/bean-cached-search research/bean_cached_search_sql_20261024
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/bean_cached_search_sql_20261024
          git commit -m 'Archive one-pass cached BEAN search with every candidate and compact score'
          git fetch origin experiment/bean-fast-ledger-20261024
          git rebase origin/experiment/bean-fast-ledger-20261024
          git push origin HEAD:experiment/bean-fast-ledger-20261024
