name: AIscend Execution Simulation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-replay:
    name: Simulated Coinbase venue, seed ${{ matrix.seed }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, seed: 20261022}
          - {os: windows-latest, seed: 41}
          - {os: ubuntu-latest, seed: 8675309}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Test pending, rejected and partially filled orders
        run: python -m unittest discover -s tests -p test_execution_simulation.py -v
      - name: Run 5,300 repeatable policy and actual-engine execution cases
        run: python -m scripts.execution_simulation --seed ${{ matrix.seed }} --policy-cases 5000 --execution-cases 300 --output artifacts/execution-simulation-${{ matrix.seed }}.json
      - name: Publish independently inspectable scenario results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aiscend-simulation-${{ matrix.seed }}
          path: artifacts/execution-simulation-*.json
          if-no-files-found: warn
          retention-days: 30
